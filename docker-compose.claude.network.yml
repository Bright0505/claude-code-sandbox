# Optional overlay: attaches claude-sandbox to a project's own Docker
# network so it can reach already-running services (e.g. an API, a DB) by
# their compose service name and run tests against them.
#
# Normal usage is ../sandbox.sh, which finds the project's network by its
# com.docker.compose.project label and passes it in as APP_NETWORK_NAME.
# Manual usage, if you already know the network name:
#
#   docker compose -f docker-compose.yml up -d          # project services first
#   WORKSPACE_DIR=$(pwd) APP_NETWORK_NAME=my-net docker compose \
#       -f docker-compose.claude.yml \
#       -f docker-compose.claude.network.yml \
#       run --rm claude-sandbox bash
#
# Inside, `curl http://api:8080/health` resolves via Docker DNS - note the
# container-internal port, not the one the host publishes.
#
# Forgetting this overlay fails silently: every service name just fails to
# resolve. See ../docs/KNOWN-ISSUES.md K-5.
services:
  claude-sandbox:
    networks:
      - app-net

networks:
  app-net:
    name: ${APP_NETWORK_NAME:-app-net}
    external: true
